<body>

<div class="nav" id="nav"></div>
<div class="container" id="app"></div>
<div class="hint" id="hint"></div>
<div id="warn"><div class="icon">⚠️</div><div class="txt">警告</div><div class="sub" id="warnSub"></div></div>

<!-- 通知弹窗 -->
<div class="modal" id="notifModal">
  <div class="modal-box">
    <div class="flex" style="justify-content:space-between"><h2 style="margin:0">🔔 通知中心</h2><button class="ghost sm" onclick="closeNotif()">关闭</button></div>
    <div id="notifList" style="margin-top:12px"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const showHint = msg => { $('hint').textContent=msg; $('hint').classList.add('show'); clearTimeout($('hint')._t); $('hint')._t=setTimeout(()=>$('hint').classList.remove('show'),5000) };

const CATS = ['综合','技术','生活','闲聊'];

// ---------- 数据持久化 ----------
let users  = JSON.parse(localStorage.getItem('u')||'[]');
let sess   = JSON.parse(sessionStorage.getItem('s')||'null');
let admin  = JSON.parse(sessionStorage.getItem('a')||'null');
let posts  = JSON.parse(localStorage.getItem('p')||'[]');
let chats  = JSON.parse(localStorage.getItem('c')||'[]');
let warns  = JSON.parse(localStorage.getItem('w')||'{}');
let mutes  = JSON.parse(localStorage.getItem('m')||'{}');
let fails  = JSON.parse(localStorage.getItem('f')||'{}');
let pms    = JSON.parse(localStorage.getItem('pm')||'[]');
let reports= JSON.parse(localStorage.getItem('rp')||'[]');
let settings= JSON.parse(localStorage.getItem('cfg')||'{}');
let follows= JSON.parse(localStorage.getItem('fl')||'[]');   // {from,to}
let favs   = JSON.parse(localStorage.getItem('fv')||'[]');   // {user,postId}
let notifs = JSON.parse(localStorage.getItem('nt')||'[]');   // {user,text,time,read,type,link}
let logs   = JSON.parse(localStorage.getItem('lg')||'[]');   // 系统日志
let captcha= '';

const defSet = {
  siteName:'Liberty Forum',allowReg:true,muteBase:60,postsPerPage:5,
  allowGuestChat:true,darkMode:false,requireEmail:false,
  maxPostLength:2000,autoHideReports:false
};
settings = {...defSet,...settings};


// ================= 云端同步（EdgeOne Pages 边缘函数 /api/state）=================
// 设计：后端只做存储，业务逻辑全部留在前端。
// 打不开后端（如本地双击打开 file://）→ 自动降级为纯 localStorage 本地模式。
const API_BASE = '/api';
let CLOUD = false, _syncTimer = null, _lastPush = {}, _pushing = false;
const STORE_KEYS = ['users','posts','chats','warns','mutes','fails','pms','reports','settings','follows','favs','notifs','logs'];

function _snap(){
  return {users,posts,chats,warns,mutes,fails,pms,reports,settings,follows,favs,notifs,logs};
}

// 防抖推送：只推变化的集合
function cloudPush(){
  if(!CLOUD) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ cloudFlush(); }, 400);
}

async function cloudFlush(){
  if(!CLOUD) return false;
  clearTimeout(_syncTimer); _syncTimer = null;
  if(_pushing) return false;
  const snap = _snap(), payload = {};
  for(const k of STORE_KEYS){
    const str = JSON.stringify(snap[k]);
    if(str !== _lastPush[k]){ payload[k] = JSON.parse(str); _lastPush[k] = str; }
  }
  if(!Object.keys(payload).length) return false;
  _pushing = true;
  try{
    const r = await fetch(API_BASE + '/state', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ state: payload })
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return true;
  }catch(e){
    for(const k in payload) _lastPush[k] = undefined; // 失败则下次重试
    return false;
  }finally{ _pushing = false; }
}

// 拉取全站数据（云端为权威，覆盖本地）
async function cloudPull(){
  const r = await fetch(API_BASE + '/state', { cache:'no-store' });
  if(!r.ok) return false;
  const j = await r.json();
  if(!j.ok || !j.state) return false;
  const s = j.state;
  let changed = false;
  const sets = {
    users:'array', posts:'array', chats:'array', pms:'array', reports:'array',
    follows:'array', favs:'array', notifs:'array', logs:'array',
    warns:'object', mutes:'object', fails:'object', settings:'object'
  };
  for(const k in sets){
    const v = s[k];
    if(v === undefined || v === null) continue;
    // 云端为空、本地已有数据 → 保留本地（首次上线时把种子数据/已有内容推上去，避免被清空）
    if(sets[k]==='array' && Array.isArray(v) && v.length===0){
      const _cur = eval(k);
      if(Array.isArray(_cur) && _cur.length>0) continue;
    }
    const ok = (sets[k]==='array') ? Array.isArray(v) : (typeof v === 'object');
    if(!ok) continue;
    const curStr = JSON.stringify(eval(k));
    const newStr = JSON.stringify(v);
    if(curStr !== newStr){
      if(k === 'settings'){ settings = Object.assign({}, settings, v); }
      else if(k === 'users'){ users = v; }
      else if(k === 'posts'){ posts = v; }
      else if(k === 'chats'){ chats = v; }
      else if(k === 'pms'){ pms = v; }
      else if(k === 'reports'){ reports = v; }
      else if(k === 'follows'){ follows = v; }
      else if(k === 'favs'){ favs = v; }
      else if(k === 'notifs'){ notifs = v; }
      else if(k === 'logs'){ logs = v; }
      else if(k === 'warns'){ warns = v; }
      else if(k === 'mutes'){ mutes = v; }
      else if(k === 'fails'){ fails = v; }
      changed = true;
    }
  }
  // 同步后刷新基线，避免把刚拉下来的数据又推回去
  const snap = _snap();
  for(const k of STORE_KEYS) _lastPush[k] = JSON.stringify(snap[k]);
  return changed;
}

// ---------- 初始化种子数据 ----------
function seed(){
  let changed=false;

// 图形验证码
function genCaptcha(cid){
  // 支持多页面各有独立 canvas（修复同页面重复 id 的隐患）
  const c=cid?$(cid):($('lcapCanvas')||$('rcapCanvas')||$('acapCanvas')||$('cap'));
  if(!c) return;
  const ctx=c.getContext&&c.getContext('2d');
  if(!ctx) return;   // canvas 不可用时安全退出，避免整页渲染崩溃
  c.width=120;c.height=40;   // 固定尺寸，避免 canvas 用默认 300x150 撑爆布局
  ctx.fillStyle='#f3f4f6';ctx.fillRect(0,0,c.width,c.height);
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='';
  for(let i=0;i<4;i++){code+=chars[Math.floor(Math.random()*chars.length)]}
  // 同时把验证码存入隐藏输入框（input 是全局可访问的 DOM 节点，比裸变量更可靠）
  try{ const ci=$('capCode'); if(ci) ci.value=code; }catch(e){}
  captcha=code;
  for(let i=0;i<4;i++){
    ctx.font=(20+Math.random()*8)+'px Arial';
    ctx.fillStyle=`hsl(${Math.random()*360},70%,45%)`;
    ctx.save();
    ctx.translate(15+i*26,22);
    ctx.rotate((Math.random()-0.5)*0.5);
    ctx.fillText(code[i],-8,6);
    ctx.restore();
  }
  for(let i=0;i<4;i++){ctx.strokeStyle='#aaa';ctx.beginPath();ctx.moveTo(Math.random()*120,Math.random()*40);ctx.lineTo(Math.random()*120,Math.random()*40);ctx.stroke()}
  for(let i=0;i<30;i++){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(Math.random()*120,Math.random()*40,2,2)}
}

// ================= render 状态保护（修复重绘导致输入丢失）=================
// 页面有 8 秒轮询 / 5 秒聊天室刷新 / 1 秒锁定倒计时 等多个定时器会调用 render()，
// render() 会整个重建 DOM。若不保护，用户正在输入的内容、验证码提示、倒计时都会被清空。
function _snapState(){
  const s = { vals:{}, html:{}, focus:null, selStart:null, selEnd:null };
  try{
    document.querySelectorAll('input,textarea,select').forEach(function(el){
      if(!el.id) return;
      if(el.type==='checkbox'||el.type==='radio') s.vals[el.id] = el.checked ? '1':'';
      else s.vals[el.id] = el.value;
    });
    ['phoneTip','emailTip','lerr','rerr','aerr','lockTip','curEmail'].forEach(function(id){
      const el = document.getElementById(id);
      if(el) s.html[id] = el.innerHTML;
    });
    const ae = document.activeElement;
    if(ae && ae.id){ s.focus = ae.id; try{ s.selStart=ae.selectionStart; s.selEnd=ae.selectionEnd; }catch(e){} }
  }catch(e){}
  return s;
}
function _restoreState(s){
  if(!s) return;
  try{
    for(const id in s.vals){
      const el = document.getElementById(id);
      if(!el) continue;
      if(el.type==='checkbox'||el.type==='radio') el.checked = (s.vals[id]==='1');
      else if(el.value !== s.vals[id]) el.value = s.vals[id];
    }
    for(const id in s.html){
      const el = document.getElementById(id);
      if(el && el.innerHTML !== s.html[id]) el.innerHTML = s.html[id];
    }
    if(s.focus){
      const el = document.getElementById(s.focus);
      if(el && typeof el.focus === 'function'){
        el.focus();
        try{ if(s.selStart!==null && el.setSelectionRange) el.setSelectionRange(s.selStart, s.selEnd); }catch(e){}
      }
    }
  }catch(e){}
}

function pm(a){
  const me=sess.username;
  const peers=[...new Set(pms.filter(m=>m.from===me||m.to===me).map(m=>m.from===me?m.to:m.from))];
  let cur=new URLSearchParams(location.search).get('with')||peers[0]||'';
  let html=`<div class="card"><h2>私信 ${unreadBadge()}</h2>
    <div class="pm-list">
      <div class="pm-users">`;
  if(!peers.length) html+=`<p class="muted small">暂无会话，去论坛或用户页发起私信吧</p>`;
  peers.forEach(p=>{
    const unr=pms.filter(m=>m.from===p&&m.to===me&&!m.read).length;
    html+=`<div class="${p===cur?'active':''}" onclick="location.search='?with=${encodeURIComponent(p)}';render()"><b>${esc(p)}</b>${unr?`<span class="badge">${unr}</span>`:''}</div>`;
  });
  html+=`</div>
      <div class="pm-box">
        ${cur?pmThread(cur):'<p class="muted">选择左侧会话</p>'}
      </div>
    </div>
  </div>`;
  a.innerHTML=html;
}
function pmThread(cur){
  const me=sess.username;
  const list=pms.filter(m=>(m.from===me&&m.to===cur)||(m.from===cur&&m.to===me)).sort((a,b)=>a.time-b.time);
  list.filter(m=>m.to===me&&!m.read).forEach(m=>m.read=true); save();
  return `<h3>与 ${esc(cur)} 的对话</h3>
    <div class="chat-box" id="pmBox" style="height:280px">
      ${list.map(m=>`<div class="chat-msg ${m.from===me?'me':''}">${esc(m.text)}<div class="muted" style="font-size:11px">${new Date(m.time).toLocaleTimeString()}</div></div>`).join('')||'<p class="muted">开始对话吧～</p>'}
    </div>
    <div class="row"><input id="pmi" placeholder="输入消息"><button class="btn" onclick="sendPm('${esc(cur)}')">发送</button></div>`;
}

function postDetail(a){
  const p=posts.find(x=>x.id===window._curPost);
  if(!p){go('forum');return}
  if(p.hidden&&!isAdmin()){a.innerHTML='<div class="card"><h2>该帖子已被隐藏</h2><button class="ghost" onclick="go(\'forum\')">返回</button></div>';return}
  const isFav = sess && favs.some(f=>f.user===sess.username&&f.postId===p.id);
  const isMine = sess && sess.username===p.author;
  let html=`<div class="card">
    <div class="flex" style="justify-content:space-between"><h2 style="margin:0">${esc(p.title)}</h2>
      ${isAdmin()?`<button class="ghost sm" onclick="adminToggleTop(${p.id})">${p.top?'取消置顶':'置顶'}</button>`:''}
    </div>
    <div class="meta">
      <span class="avatar sm" style="background:${avatarColor(p.author)};margin-right:4px">${(p.author[0]||'?').toUpperCase()}</span>
      ${esc(p.author)} · ${new Date(p.time).toLocaleString()} · <span class="tag">${esc(p.cat)}</span> 👁${p.views} ❤️${p.likes} 💬${p.comments.length}
      ${isFav?' ⭐':''}
    </div>
    <p style="margin-top:10px;white-space:pre-wrap">${esc(p.body)}</p>
    <div style="margin-top:10px">
      <button class="ghost" onclick="like(${p.id})">❤️ 点赞 (${p.likes})</button>
      ${sess?`<button class="ghost" onclick="toggleFav(${p.id})">${isFav?'★ 已收藏':'☆ 收藏'}</button>`:''}
      ${sess&&!isMine?`<button class="ghost" onclick="sendPm('${esc(p.author)}')">✉️ 私信作者</button>`:''}
      ${sess&&!isMine?`<button class="ghost sm" onclick="toggleFollow('${esc(p.author)}')">${follows.some(f=>f.from===sess.username&&f.to===p.author)?'✓ 已关注':'＋ 关注'}</button>`:''}
      ${isMine?`<button class="ghost sm" onclick="editPost(${p.id})">编辑</button>`:''}
      ${isMine||isAdmin()?`<button class="btn danger sm" onclick="delMyPost(${p.id})">删除帖子</button>`:''}
      ${sess&&!isMine&&!isAdmin()?`<button class="ghost sm" onclick="report('post',${p.id},'${esc(p.title).replace(/'/g,"")}')">举报</button>`:''}
    </div>
  </div>
  <div class="card"><h3>评论 (${p.comments.length})</h3>`;
  if(sess){
    html+=`<div class="row"><input id="cmi" placeholder="写下你的评论…"><button class="btn sm" onclick="addComment(${p.id})">发送</button></div>`;
  }
  html+='<div style="margin-top:10px">';
  if(!p.comments.length) html+=`<p class="muted">还没有评论，来抢沙发吧</p>`;
  p.comments.forEach((c,i)=>{
    html+=`<div class="comment" id="cm-${p.id}-${i}">
      <b>${esc(c.author)}</b> <span class="muted small">${new Date(c.time).toLocaleString()}</span>
      ${sess?`<button class="ghost sm" onclick="likeComment(${p.id},${i})">👍 ${c.likes||0}</button>`:''}
      ${sess?`<button class="ghost sm" onclick="showReply(${p.id},${i})">回复</button>`:''}
      ${isAdmin()||c.author===sess?.username?`<button class="btn danger sm" onclick="delComment(${p.id},${i})">删</button>`:''}
      ${sess&&c.author!==sess.username&&!isAdmin()?`<button class="ghost sm" onclick="report('comment','${p.id}_${i}','评论')">举报</button>`:''}
      <span style="white-space:pre-wrap">${esc(c.text)}</span>
      <div class="sub-comment" id="replies-${p.id}-${i}">`;
    (c.replies||[]).forEach((r,j)=>{
      html+=`<div><b>${esc(r.author)}</b> <span class="muted small">${new Date(r.time).toLocaleString()}</span>
        ${isAdmin()||r.author===sess?.username?`<button class="btn danger sm" onclick="delReply(${p.id},${i},${j})">删</button>`:''}
        <span style="white-space:pre-wrap">${esc(r.text)}</span></div>`;
    });
    html+=`</div></div>`;
  });
  html+='</div></div>';
  a.innerHTML=html;
}

// ================= 密码哈希 =================
// 注意：此前 doAdmin() 调用了 hashPwd()，但这个函数从未定义过，
// 导致管理员登录时抛出 ReferenceError、整个登录流程中断。
// 这里补齐定义，并对不支持 crypto.subtle 的环境做降级。
async function hashPwd(pwd){
  const s=String(pwd||'');
  try{
    if(globalThis.crypto && crypto.subtle && crypto.subtle.digest && typeof TextEncoder!=='undefined'){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return 'sha256$' + Array.from(new Uint8Array(buf))
        .map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  // 降级：非安全上下文（如 file:// 打开）无 crypto.subtle
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=(h1^c)*16777619>>>0;
    h2=(h2+c)*(i+7)>>>0;
  }
  return 'fallback$'+h1.toString(16)+h2.toString(16);
}

// 容错错误提示：优先写指定 id，找不到则降级到其他容器或全局提示，绝不因 null 崩溃

}

// ================= 手机验证码登录（服务端 /api/verifycode）=================
let phoneCooldown=0, phoneCdTimer=null;
window.sendPhoneCode=async function(){
  const ph=($('lph')||{}).value, tip=$('phoneTip'), err=$('lerr');
  if(err) err.textContent='';
  if(!/^1[3-9]\d{9}$/.test(ph||'')){ if(err) err.textContent='请输入正确的 11 位手机号'; return; }
  if(phoneCooldown>0){ if(tip) tip.textContent=phoneCooldown+' 秒后可重发'; return; }
  if(tip) tip.textContent='发送中…';
  try{
    const r=await fetch(API_BASE+'/verifycode',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'send',type:'phone',target:ph})});
    const j=await r.json();
    if(!j.ok){ if(tip) tip.textContent=''; if(err) err.textContent=j.error||('发送失败'); return; }
    if(j.demo&&j.code){ saveDemoCode('phone',ph,j.code); if(tip) tip.innerHTML='<b style="color:#16a34a">演示验证码：'+j.code+'</b>（5分钟有效）'; showHint('验证码（演示）：'+j.code); }
    else { if(tip) tip.textContent='验证码已发送，5 分钟内有效'; showHint('验证码已发送'); }
    phoneCooldown=60;
    const btn=$('btnSendCode'); if(btn){btn.disabled=true;btn.textContent=phoneCooldown+'s';}
    clearInterval(phoneCdTimer);
    phoneCdTimer=setInterval(function(){
      phoneCooldown--;
      const b=$('btnSendCode');
      if(phoneCooldown<=0){clearInterval(phoneCdTimer); if(b){b.disabled=false;b.textContent='获取验证码';} if($('phoneTip'))$('phoneTip').textContent='';}
      else if(b){b.textContent=phoneCooldown+'s';}
    },1000);
  }catch(e){ if(tip) tip.textContent=''; if(err) err.textContent='网络异常，无法获取验证码（请确认已部署 /api/verifycode）'; }

  const ph=($('lph')||{}).value, code=($('lvcode')||{}).value, err=$('lerr');
  if(err) err.textContent='';
  if(!/^1[3-9]\d{9}$/.test(ph||'')){ if(err) err.textContent='请输入正确的手机号'; return; }
  if(!/^\d{6}$/.test(code||'')){ if(err) err.textContent='请输入 6 位验证码'; return; }
  try{
    const r=await fetch(API_BASE+'/verifycode',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'verify',type:'phone',target:ph,code:code})});
    const j=await r.json();
    if(!j.valid){
      // 服务端不可用（KV 未绑定等）→ 用页面显示的演示码本地校验
      if(checkDemoCode('phone',ph,code)){ /* 通过，继续登录 */ }
      else { if(err) err.textContent=j.error||('验证码错误'); return; }
    }
  }catch(e){
    if(checkDemoCode('phone',ph,code)){ /* 兜底通过 */ }
    else { if(err) err.textContent='网络异常，无法校验验证码'; return; }
  }
  let u=users.find(x=>x.phone===ph);
  if(!u){
    let base='user_'+ph.slice(-4), name=base, i=1;
    while(users.find(x=>x.username===name)) name=base+(++i);
    u={username:name,password:'',phone:ph,email:'',role:'user',bio:'',avatar:'',time:Date.now(),verified:true};
    users.push(u); save(); addLog('info','手机号注册: '+name);
    showHint('已自动创建账号：'+name);
  }
  sess={username:u.username}; sessionStorage.setItem('s',JSON.stringify(sess));
  addLog('info','手机号登录: '+u.username);
  go('home'); render();
};

window.sendBindEmailCode=async function(){
  const em=($('secEmail')||{}).value, tip=$('emailTip');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em||'')){ if(tip) tip.textContent='请输入正确的邮箱地址'; return; }
  if(emailCooldown>0){ if(tip) tip.textContent=emailCooldown+' 秒后可重发'; return; }
  if(tip) tip.textContent='发送中…';
  try{
    const r=await fetch(API_BASE+'/verifycode',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'send',type:'email',target:em})});
    const j=await r.json();
    if(!j.ok){ if(tip) tip.textContent=j.error||('发送失败'); return; }
    if(j.demo&&j.code){ saveDemoCode('email',em,j.code); if(tip) tip.innerHTML='<b style="color:#16a34a">演示验证码：'+j.code+'</b>'; showHint('验证码（演示）：'+j.code); }
    else { if(tip) tip.textContent='验证码已发送至邮箱，5 分钟内有效'; showHint('验证码已发送'); }
    emailCooldown=60;
    const btn=$('btnSendEmail'); if(btn){btn.disabled=true;btn.textContent=emailCooldown+'s';}
    clearInterval(emailCdTimer);
    emailCdTimer=setInterval(function(){
      emailCooldown--;
      const b=$('btnSendEmail');
      if(emailCooldown<=0){clearInterval(emailCdTimer); if(b){b.disabled=false;b.textContent='获取验证码';}}
      else if(b){b.textContent=emailCooldown+'s';}
    },1000);
  }catch(e){ if(tip) tip.textContent='网络异常，无法获取验证码'; }
};

// ================= 演示码本地兜底（KV/服务端不可用时仍能测通流程）=================
window.__demoCodes = window.__demoCodes || {};
function saveDemoCode(type, target, code){
  window.__demoCodes[type+':'+target] = { code:String(code), expire:Date.now()+5*60*1000, at:Date.now() };
  // 记住最近一次演示码，页面重绘后可重新显示出来
  window.__lastDemo = { type:type, target:target, code:String(code), expire:Date.now()+5*60*1000 };
  _redrawDemoTip();
}
// 重绘后把演示验证码重新写回页面（防止 render 清空导致"看一眼就没了"）
function _redrawDemoTip(){
  const d = window.__lastDemo;
  if(!d) return;
  if(Date.now() > d.expire){ window.__lastDemo=null; return; }
  const left = Math.ceil((d.expire - Date.now())/1000);
  if(d.type==='phone'){
    const t=$('phoneTip');
    if(t) t.innerHTML='<b style="color:#16a34a">演示验证码：'+d.code+'</b>（剩余 '+left+' 秒）';
  }else if(d.type==='email'){
    const t=$('emailTip');
    if(t) t.innerHTML='<b style="color:#16a34a">演示验证码：'+d.code+'</b>（剩余 '+left+' 秒）';
  }
}
function checkDemoCode(type, target, code){
  const r = window.__demoCodes[type+':'+target];
  if(!r) return false;
  if(Date.now() > r.expire) return false;
  return r.code === String(code).trim();
}


// ================= 软件商店：真实官方图标（四层回退）=================
// 本地 icons/{id}.png → 官网 apple-touch-icon → 官网 favicon.ico → favicon.im → emoji
window.__noLocalIcons = false;   // 本地图标目录不存在时自动跳过，避免重复 404

function appHost(a){
  try{ return String(a.url||'').replace(/^https?:\/\//i,'').split('/')[0]; }
  catch(e){ return ''; }
}

// 生成图标 HTML（卡片 / 榜单 / 详情弹窗统一调用）
function appIcon(a, cls, style){
  const host = appHost(a);
  const emoji = a.ico || '📦';
  const clsStr = cls ? ' '+cls : '';
  const styleStr = style || ('background:'+(a.color||'#7c3aed'));
  if(!host) return '<div class="ico'+clsStr+'" style="'+styleStr+'"><span class="ico-emoji">'+emoji+'</span></div>';
  const startSrc = window.__noLocalIcons
    ? 'https://'+host+'/apple-touch-icon.png'
    : 'icons/'+a.id+'.png';
  const startStep = window.__noLocalIcons ? '2' : '1';
  return '<div class="ico'+clsStr+'" style="'+styleStr+'">'
       + '<img src="'+startSrc+'" alt="'+esc(a.name||'')+'" loading="lazy"'
       + ' data-step="'+startStep+'" data-host="'+host+'" data-emoji="'+emoji+'"'
       + ' onerror="icoFallback(this)"></div>';
}

// 图标加载失败时的逐级回退（最多回退到 emoji，不会死循环）
window.icoFallback=function(img){
  if(!img || !img.dataset) return;
  const step = img.dataset.step || '1';
  const host = img.dataset.host || '';
  const emoji = img.dataset.emoji || '📦';
  if(step === '1'){
    // 本地图标不存在 → 记住，后续图标直接从在线开始
    window.__noLocalIcons = true;
    img.dataset.step = '2';
    img.src = 'https://' + host + '/apple-touch-icon.png';
    return;
  }
  if(step === '2'){
    img.dataset.step = '3';
    img.src = 'https://' + host + '/favicon.ico';
    return;
  }
  if(step === '3'){
    img.dataset.step = '4';
    img.src = 'https://favicon.im/' + host;
    return;
  }
  // 全部失败 → 换回 emoji（直接替换父节点内容，不再触发 onerror）
  const p = img.parentNode;
  if(p) p.innerHTML = '<span class="ico-emoji">'+emoji+'</span>';
};

window.copyText=function(t,label){
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>showHint(label+'已复制：'+t)).catch(()=>{prompt('请手动复制',t)})}
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showHint(label+'已复制：'+t)}catch(e){prompt('请手动复制',t)}document.body.removeChild(ta)}
};
window.submitMessage=function(){
  const name=$('msgName').value.trim(),contact=$('msgContact').value.trim(),body=$('msgBody').value.trim();
  if(!body){$('msgOk').className='err';$('msgOk').textContent='请输入留言内容';return}
  // 以私信形式存到管理员收件箱（发给 admin），同时写日志
  if(sess){pms.push({from:sess.username,to:'admin',text:'[留言] '+(name?name:'匿名')+' | '+(contact||'无联系方式')+' ：'+body,time:Date.now(),read:false})}
  addLog('info','新留言：'+(name||'匿名')+' - '+(body.slice(0,30)));
  save();
  $('msgOk').className='ok';$('msgOk').textContent='✓ 留言已提交，我们会尽快联系您';
  $('msgName').value='';$('msgContact').value='';$('msgBody').value='';
};

// 下载：新窗口跳转该应用官方网址（安全无捆绑）
window.storeDownload=function(id){
  const app=APPS.find(a=>a.id===id);if(!app||!app.url){storeToast('该应用暂未收录官方下载地址');return;}
  addLog('info','软件商店：跳转官方下载 '+app.name+' ('+app.url+')');
  window.open(app.url,'_blank','noopener');
  if(!dlRecords.find(r=>r.id===id)){
    dlRecords.unshift({id,name:app.name,url:app.url,time:Date.now()});
    dlRecords=dlRecords.slice(0,30);saveDlRecords();
  }
  storeToast('已跳转官方下载页：'+app.name);
};


function appList(){
  let list = APPS.slice();
  // 分类：推荐 = 首页精选（hot + official 优先），其余按 cat 精确匹配
  if(storeCat==='推荐'){
    list = list.filter(a=>a.hot==='1').sort((a,b)=>b.downloads-a.downloads);
  } else {
    list = list.filter(a=>a.cat===storeCat);
  }
  if(storeKw){
    const k=storeKw.toLowerCase();
    list=list.filter(a=>a.name.toLowerCase().includes(k)||a.desc.includes(k));
  }
  return list;
}

function storeToast(msg){
  let el=$('storeToast');
  if(!el){el=document.createElement('div');el.id='storeToast';el.className='store-toast';document.body.appendChild(el)}
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);
}

function renderLockTip(capId,uid){
  // 优先用输入框用户名，输入框为空时回退到锁定记忆（防止切页/清空后倒计时消失）
  let u=$(uid)&&$(uid).value.trim();
  if(!u) u=getLockedUser();
  const tip=$('lockTip'); if(!tip) return;
  const f=isLocked(u);
  if(f){const left=Math.ceil((f.lockUntil-Date.now())/1000);
    lockedUser=u; // 锁定中持续记忆
    tip.innerHTML=`<div class="err" style="background:#fee2e2;padding:8px;border-radius:8px">⚠️ 账号「${u}」已锁定，请 ${Math.floor(left/60)}分${left%60}秒 后再试</div>`;
    if($('lcap'))$('lcap').disabled=true;
    // 倒计时归零时 isLocked 已自动清理，这里刷新为正常态
    if(left<=0) renderLockTip(capId,uid);
  } else {
    const cnt=(fails[u]&&fails[u].count)||0;
    tip.innerHTML=u?`<div class="small" style="color:#f59e0b">已失败 ${cnt}/5 次</div>`:'';
    if($('lcap'))$('lcap').disabled=false;
    // 解锁后恢复登录按钮（倒计时归零时也能即时启用）
    const btn=document.querySelector('#app .card button.btn');
    if(btn) btn.disabled=false;
  }
}
